name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy-check:
    name: policy-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
      - name: Check repository policy invariants
        shell: bash
        run: |
          VERSION_FILE=platform/opencode/VERSION
          test -f "$VERSION_FILE"
          version_lines="$(grep -E '^OPENCODE_VERSION=' "$VERSION_FILE" || true)"
          test "$(printf '%s\n' "$version_lines" | sed '/^$/d' | wc -l)" -eq 1
          awk 'BEGIN { count=0; ok=1 } /^[[:space:]]*#/ || /^[[:space:]]*$/ { next } /^OPENCODE_VERSION=/ { count++; if ($0 !~ /^OPENCODE_VERSION=[0-9]+\.[0-9]+\.[0-9]+$/) ok=0; next } /^[A-Za-z_][A-Za-z0-9_]*=/ { next } { ok=0 } END { exit !(count == 1 && ok) }' "$VERSION_FILE"
          test "$(grep -E '^OPENCODE_VERSION=' "$VERSION_FILE" | cut -d= -f2)" = "1.18.32"
          test "$(find .opencode/commands -maxdepth 1 -type f | wc -l)" -eq 9
          test "$(find .opencode/skills -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 26
          test -f README.md
          test -f docs/ARCHITECTURE-BLUEPRINT.md
          ! git ls-files --error-unmatch .env >/dev/null 2>&1

  runtime-tests:
    name: runtime-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
      - name: Install repository-local Oracle dependencies
        working-directory: runtime/mcp/servers/oracle
        run: npm ci
      - name: Phase 6 runtime tests
        run: node runtime/tests/runtime-utils.test.js
      - name: Phase 6 health tests
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File runtime/tests/health-runtime.test.ps1
      - name: Oracle deterministic tests
        run: node runtime/mcp/servers/oracle/tests/run-all.js
      - name: MCP M01-M08 binding tests
        run: node runtime/mcp/servers/oracle/tests/mcp-binding.test.js
      - name: Context Hydration contract tests
        run: node runtime/tests/context-hydration/run-all.js
      - name: Job Isolation contract tests
        run: node runtime/tests/job-isolation/run-all.js

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test security scanner fail-closed semantics
        shell: bash
        run: bash .github/scripts/security-scan.test.sh
      - name: Check prohibited tracked patterns
        shell: bash
        run: bash .github/scripts/security-scan.sh

  docs-contract:
    name: docs-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation contract
        shell: bash
        run: |
          test -f README.md
          test -f docs/ARCHITECTURE-BLUEPRINT.md
          test -f docs/WORKFLOW.md
          test -f docs/BUILD-PLAN.md
          test -f docs/governance/repository-collaboration.md
          grep -Fq 'CURRENT VERIFIED ARCHITECTURE' docs/ARCHITECTURE-BLUEPRINT.md
          grep -Fq 'Phase 9A' docs/ARCHITECTURE-BLUEPRINT.md
          grep -Fq 'TARGET' docs/ARCHITECTURE-BLUEPRINT.md
          grep -Fq 'Phase 9B' docs/ARCHITECTURE-BLUEPRINT.md
          grep -Fq 'Phase 9C' docs/ARCHITECTURE-BLUEPRINT.md
          grep -Eq 'Context Hydration.*VERIFIED' docs/ARCHITECTURE-BLUEPRINT.md
          grep -Fq 'context-hydration@1.0.1' docs/ARCHITECTURE-BLUEPRINT.md
          grep -Fq '37/37' docs/ARCHITECTURE-BLUEPRINT.md
          grep -Eq 'Phase 9B.*VERIFIED' docs/ARCHITECTURE-BLUEPRINT.md
          if grep -Fq 'Phase 9B is IN PROGRESS' docs/ARCHITECTURE-BLUEPRINT.md; then echo 'stale Phase 9B IN PROGRESS claim in docs/ARCHITECTURE-BLUEPRINT.md'; exit 1; fi
          if grep -Fq 'Phase 9B acceptance: NOT VERIFIED' docs/ARCHITECTURE-BLUEPRINT.md; then echo 'stale Phase 9B acceptance claim in docs/ARCHITECTURE-BLUEPRINT.md'; exit 1; fi
          if grep -Fq 'Phase 9B and Phase 9C remain TARGET' docs/ARCHITECTURE-BLUEPRINT.md; then echo 'stale Phase 9B TARGET claim in docs/ARCHITECTURE-BLUEPRINT.md'; exit 1; fi
          grep -Eq 'Phase 9C.*TARGET' docs/ARCHITECTURE-BLUEPRINT.md
          grep -Eq 'Phase 9A.*VERIFIED' docs/BUILD-PLAN.md
          grep -Eq 'Phase 9B.*VERIFIED' docs/BUILD-PLAN.md
          grep -Fq '## In-progress work' docs/BUILD-PLAN.md
          if grep -Eq 'Phase 9B.*TARGET' docs/BUILD-PLAN.md; then echo 'stale Phase 9B TARGET state in docs/BUILD-PLAN.md'; exit 1; fi
          grep -Eq 'Phase 9C.*TARGET' docs/BUILD-PLAN.md
          if grep -Eq 'Phase 9A.*TARGET' docs/BUILD-PLAN.md; then echo 'stale Phase 9A TARGET state in docs/BUILD-PLAN.md'; exit 1; fi
          grep -Fq 'Phase 9A is VERIFIED' docs/WORKFLOW.md
          grep -Eq 'Phase 9B.*VERIFIED' docs/WORKFLOW.md
          if grep -Fq 'Phase 9B acceptance: NOT VERIFIED' docs/WORKFLOW.md; then echo 'stale Phase 9B acceptance claim in docs/WORKFLOW.md'; exit 1; fi
          if grep -Fq 'RCB-06 branch rules and RCB-07 project metadata are pending' docs/WORKFLOW.md; then echo 'stale RCB pending claim in docs/WORKFLOW.md'; exit 1; fi
          if grep -Eq 'Phase 9A.*TARGET' docs/WORKFLOW.md; then echo 'stale Phase 9A TARGET state in docs/WORKFLOW.md'; exit 1; fi
          grep -Fq 'Phase 9A' docs/governance/repository-collaboration.md
          grep -Fq 'VERIFIED / CLOSED' docs/governance/repository-collaboration.md
          grep -Fq 'Phase 9B' docs/governance/repository-collaboration.md
          grep -Fq '#37' docs/governance/repository-collaboration.md
          grep -Fq '#42' docs/governance/repository-collaboration.md
          grep -Eq '#42.*CLOSED / VERIFIED' docs/governance/repository-collaboration.md
          test -f docs/MIGRATION-MANIFEST.md
          test -f docs/acceptance/phase-9b.md
          grep -Fq 'Repository collaboration activation is VERIFIED' README.md
          grep -Eq 'Phase 9A.*VERIFIED' README.md
          grep -Fq '37/37' README.md
          grep -Fq 'context-hydration@1.0.1' README.md
          grep -Eq 'Phase 9B.*VERIFIED' README.md
          grep -Fq 'job-isolation@1.0.0' README.md
          grep -Fq 'PARTIAL' README.md
          if grep -Eq 'Phase 9B.*IN PROGRESS' README.md; then echo 'stale Phase 9B IN PROGRESS claim in README.md'; exit 1; fi
          if grep -Fq 'Phase 9B acceptance closure' README.md; then echo 'stale Phase 9B pending-acceptance claim in README.md'; exit 1; fi
          if grep -Fq 'Phase 9B and Phase 9C remain TARGET' README.md; then echo 'stale Phase 9B TARGET claim in README.md'; exit 1; fi
          grep -Eq 'Phase 9C.*TARGET' README.md
          if grep -Fq 'Phase 9A is also TARGET' README.md; then echo 'stale Phase 9A TARGET claim in README.md'; exit 1; fi
          if grep -Fq 'no Phase 9 capability is claimed as implemented' README.md; then echo 'stale no-Phase-9 claim in README.md'; exit 1; fi
          if grep -Fq 'Repository activation is pending' README.md; then echo 'stale activation-pending claim in README.md'; exit 1; fi
          if grep -Fq 'commits and remotes are currently absent' README.md; then echo 'stale absent-remotes claim in README.md'; exit 1; fi
          if grep -Fq 'GitHub collaboration files belong to RCB-03 and are not created yet' README.md; then echo 'stale RCB-03 claim in README.md'; exit 1; fi
          grep -Eq 'Phase 9A.*VERIFIED' docs/MIGRATION-MANIFEST.md
          grep -Eq 'Phase 9B.*VERIFIED' docs/MIGRATION-MANIFEST.md
          grep -Fq 'job-isolation@1.0.0' docs/MIGRATION-MANIFEST.md
          if grep -Fq 'Phase 9B is active implementation work' docs/MIGRATION-MANIFEST.md; then echo 'stale Phase 9B active-work claim in docs/MIGRATION-MANIFEST.md'; exit 1; fi
          grep -Fq 'PARTIAL' docs/MIGRATION-MANIFEST.md
          if grep -Fq 'Phase 9B Job Isolation + Parallelism is TARGET / PLANNED' docs/MIGRATION-MANIFEST.md; then echo 'stale Phase 9B TARGET / PLANNED claim in docs/MIGRATION-MANIFEST.md'; exit 1; fi
          if grep -Fq 'Phase 9B and Phase 9C remain future target work' docs/MIGRATION-MANIFEST.md; then echo 'stale Phase 9B future-work claim in docs/MIGRATION-MANIFEST.md'; exit 1; fi
          grep -Eq 'Phase 9C.*TARGET' docs/MIGRATION-MANIFEST.md
          grep -Eq 'RCB-07.*VERIFIED' docs/MIGRATION-MANIFEST.md
          if grep -Fq 'RCB-03 through RCB-07 are PENDING' docs/MIGRATION-MANIFEST.md; then echo 'stale RCB pending claim in docs/MIGRATION-MANIFEST.md'; exit 1; fi
          if grep -Eq 'Phase 9A.*TARGET' docs/MIGRATION-MANIFEST.md; then echo 'stale Phase 9A TARGET state in docs/MIGRATION-MANIFEST.md'; exit 1; fi
          if grep -Fq 'No GitHub remote' docs/MIGRATION-MANIFEST.md; then echo 'stale no-remote claim in docs/MIGRATION-MANIFEST.md'; exit 1; fi
          if grep -Fq 'Phase 9 implementation is claimed' docs/MIGRATION-MANIFEST.md; then echo 'stale no-Phase-9-implementation claim in docs/MIGRATION-MANIFEST.md'; exit 1; fi
          grep -Fq 'job-isolation@1.0.0' docs/ARCHITECTURE-BLUEPRINT.md
          grep -Fq 'CONTRACT LOCKED' docs/ARCHITECTURE-BLUEPRINT.md
          grep -Fq 'JobContract v1' docs/ARCHITECTURE-BLUEPRINT.md
          grep -Fq 'exactly 8 canonical fields' docs/ARCHITECTURE-BLUEPRINT.md
          grep -Fq 'working context as a derived job-scoped view, not a JobContract field' docs/ARCHITECTURE-BLUEPRINT.md
          grep -Fq 'operation-specific execution targets such as database targets' docs/ARCHITECTURE-BLUEPRINT.md
          if grep -Fq 'A unified JobContract does not yet exist' docs/ARCHITECTURE-BLUEPRINT.md; then echo 'stale JobContract claim in docs/ARCHITECTURE-BLUEPRINT.md'; exit 1; fi
          grep -Fq 'Runtime implementation: PARTIAL' docs/ARCHITECTURE-BLUEPRINT.md
          grep -Fq 'PARTIAL' docs/ARCHITECTURE-BLUEPRINT.md
          if grep -Fq 'Runtime implementation: NOT STARTED' docs/ARCHITECTURE-BLUEPRINT.md; then echo 'stale runtime implementation status in docs/ARCHITECTURE-BLUEPRINT.md'; exit 1; fi
          grep -Fq 'job-isolation@1.0.0' docs/WORKFLOW.md
          grep -Fq 'Governance contract: LOCKED' docs/WORKFLOW.md
          grep -Fq 'Runtime implementation: PARTIAL' docs/WORKFLOW.md
          grep -Fq 'PARTIAL' docs/WORKFLOW.md
          if grep -Fq 'Runtime implementation: NOT STARTED' docs/WORKFLOW.md; then echo 'stale runtime implementation status in docs/WORKFLOW.md'; exit 1; fi
          if grep -Fq 'governance not yet locked' docs/WORKFLOW.md; then echo 'stale Phase 9B lock claim in docs/WORKFLOW.md'; exit 1; fi
          grep -Fq 'PHASE 9B VERIFIED' docs/acceptance/phase-9b.md
          grep -Eq '9B-06 Acceptance.*VERIFIED' docs/acceptance/phase-9b.md
          grep -Fq 'job-isolation@1.0.0' docs/acceptance/phase-9b.md
          if grep -Eq 'Phase 9B.*IN PROGRESS' docs/acceptance/phase-9b.md; then echo 'stale Phase 9B IN PROGRESS claim in docs/acceptance/phase-9b.md'; exit 1; fi
          if grep -Fq '9B-06 NOT VERIFIED' docs/acceptance/phase-9b.md; then echo 'stale 9B-06 NOT VERIFIED claim in docs/acceptance/phase-9b.md'; exit 1; fi
          if grep -Fq 'Phase 9B acceptance remains pending' docs/acceptance/phase-9b.md; then echo 'stale Phase 9B acceptance-pending claim in docs/acceptance/phase-9b.md'; exit 1; fi
          awk '/^9B-06 Acceptance:$/ { getline; if ($0 == "VERIFIED") found = 1 } END { exit(found ? 0 : 1) }' governance/contracts/job-isolation-v1.md
          if grep -A1 -F '9B-06 Acceptance:' governance/contracts/job-isolation-v1.md | grep -Fq 'NOT VERIFIED'; then echo 'stale 9B-06 status in governance/contracts/job-isolation-v1.md'; exit 1; fi
